<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360" />
    <title>天气 · 日历 · 新闻</title>
    <!--
      防白屏：
      1. 窗口在 tauri.conf.json 中 visible=false 启动。
      2. 这里内联首屏关键样式与卡片背景色，保证 WebView 首帧即有内容、无空白闪烁。
      3. 前端首帧渲染完成后 emit("app-ready")，Rust 端才 show() 窗口。
    -->
    <style>
      :root { color-scheme: light dark; }
      /* WebView 背景：极浅灰白，窗口直角后不透出白四角 */
      html, body {
        margin: 0; padding: 0;
        background: #f4f6f9;
        font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      /* 启动占位骨架，App 挂载前显示，避免白屏 */
      #boot {
        width: 320px; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        color: #9ca3af; font-size: 12px; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">正在启动…</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
